name: Release from config

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'config.py'
      - 'scripts/release_guard.py'
      - '.github/workflows/release.yml'

jobs:
  guard-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run release guard
        id: release_guard
        run: python scripts/release_guard.py

      - name: Create or push release tag
        env:
          CONFIG_VERSION: ${{ steps.release_guard.outputs.config_version }}
        shell: bash
        run: |
          set -euo pipefail

          git fetch --tags origin
          if git rev-parse -q --verify "refs/tags/${CONFIG_VERSION}" >/dev/null; then
            echo "Tag ${CONFIG_VERSION} already exists; nothing to create."
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag -a "${CONFIG_VERSION}" -m "Release ${CONFIG_VERSION}"
            git push origin "${CONFIG_VERSION}"
          fi

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          CONFIG_VERSION: ${{ steps.release_guard.outputs.config_version }}
        shell: bash
        run: |
          set -euo pipefail

          if gh release view "${CONFIG_VERSION}" >/dev/null 2>&1; then
            echo "Release ${CONFIG_VERSION} already exists; updating."
            gh release edit "${CONFIG_VERSION}" \
              --title "Release ${CONFIG_VERSION}"
          else
            echo "Release ${CONFIG_VERSION} does not exist; creating."
            gh release create "${CONFIG_VERSION}" \
              --title "Release ${CONFIG_VERSION}" \
              --notes "Automated release ${CONFIG_VERSION} based on config.py"
          fi
