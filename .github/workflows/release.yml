name: Release from config

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    paths:
      - 'config.py'
      - 'scripts/release_guard.py'
      - '.github/workflows/release.yml'

jobs:
  guard-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run release guard
        run: python scripts/release_guard.py

      - name: Extract release version
        id: release
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import config
          print(f"version={config.CONFIG_VERSION}")
          PY

      - name: Create or push release tag
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          git fetch --tags origin
          if git rev-parse -q --verify "refs/tags/${RELEASE_VERSION}" >/dev/null; then
            echo "Tag ${RELEASE_VERSION} already exists; nothing to create."
          else
            git tag "${RELEASE_VERSION}"
            git push origin "${RELEASE_VERSION}"
          fi
